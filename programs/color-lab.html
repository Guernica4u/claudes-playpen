<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Color Lab</title>
<style>
:root{--bg:#0e0f13;--panel:#161820;--ink:#e8e6e3;--muted:#8a8f9c;--line:#2a2d3a;--accent:#f0b35a;--good:#5fcf80;--bad:#ff7a6b}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:24px 16px}
h1{font-size:18px;letter-spacing:.06em;margin:0 0 16px;font-weight:650}
h1 span{color:var(--accent)}
h2{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;font-weight:600}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:760px){.cols{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.pick{display:flex;gap:12px;align-items:stretch}
.big{flex:none;width:110px;border-radius:10px;border:1px solid var(--line);position:relative;overflow:hidden;cursor:pointer}
.big input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.fields{flex:1;display:flex;flex-direction:column;gap:6px}
.f{display:flex;align-items:center;gap:8px}
.f span{width:36px;color:var(--muted);font-size:12px}
.f input{flex:1;font:13px ui-monospace,Consolas,monospace;background:#0f1117;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-width:0}
.f input:focus{outline:none;border-color:#4a5066}
.f button{padding:4px 8px;font-size:11.5px}
button{font:inherit;font-size:13px;color:var(--ink);background:#1e212b;border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer}
button:hover{border-color:#4a5066}
.sliders{margin-top:12px;display:grid;gap:8px}
.sl{display:grid;grid-template-columns:18px 1fr 44px;gap:8px;align-items:center;font-size:12px;color:var(--muted)}
.sl input[type=range]{width:100%;-webkit-appearance:none;appearance:none;height:12px;border-radius:6px;outline:none;border:1px solid var(--line)}
.sl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#fff;border:2px solid #0008;cursor:pointer}
.sl input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#fff;border:2px solid #0008;cursor:pointer}
.sl output{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink)}
.contrast .sample{border-radius:10px;padding:16px;border:1px solid var(--line);margin-bottom:10px}
.sample .lg{font-size:24px;font-weight:700;margin:0 0 4px}
.sample p{margin:0}
.ratio{font:700 30px ui-monospace,Consolas,monospace}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.badge{font-size:11.5px;padding:2px 8px;border-radius:12px;border:1px solid}
.badge.ok{color:var(--good);border-color:#2f5d3c}
.badge.no{color:var(--bad);border-color:#5a3036}
.pair{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.pair input[type=text]{width:110px;font:13px ui-monospace,Consolas,monospace;background:#0f1117;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
.pair .dot{width:22px;height:22px;border-radius:50%;border:1px solid var(--line)}
.row{margin-top:14px}
.swatches{display:flex;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.swatches div{flex:1;height:64px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px;font:11px ui-monospace,Consolas,monospace;cursor:pointer;transition:flex .15s}
.swatches div:hover{flex:1.4}
.label{display:flex;justify-content:space-between;align-items:center;margin:14px 0 6px;font-size:12.5px;color:var(--muted)}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#23262f;border:1px solid var(--line);padding:6px 12px;border-radius:6px;opacity:0;transition:opacity .25s;pointer-events:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>COLOR<span>LAB</span></h1>
  <div class="cols">
    <div class="card">
      <h2>Pick</h2>
      <div class="pick">
        <div class="big" id="big"><input type="color" id="native" title="Open system colour picker"></div>
        <div class="fields">
          <div class="f"><span>HEX</span><input id="hex"><button data-copy="hex">Copy</button></div>
          <div class="f"><span>RGB</span><input id="rgb"><button data-copy="rgb">Copy</button></div>
          <div class="f"><span>HSL</span><input id="hsl"><button data-copy="hsl">Copy</button></div>
          <div class="f"><span>OKLCH</span><input id="oklch" readonly><button data-copy="oklch">Copy</button></div>
        </div>
      </div>
      <div class="sliders">
        <div class="sl">H<input type="range" id="sH" min="0" max="360"><output id="oH"></output></div>
        <div class="sl">S<input type="range" id="sS" min="0" max="100"><output id="oS"></output></div>
        <div class="sl">L<input type="range" id="sL" min="0" max="100"><output id="oL"></output></div>
      </div>
      <div class="row"><button id="random">Random colour</button> <button id="eyedrop" hidden>Pick from screen</button></div>
    </div>
    <div class="card contrast">
      <h2>Contrast check</h2>
      <div class="pair">
        <span class="dot" id="fgDot"></span><input type="text" id="fg" title="Text colour">
        <span style="color:var(--muted)">on</span>
        <span class="dot" id="bgDot"></span><input type="text" id="bg" title="Background colour">
        <button id="swapFB">⇄</button><button id="usePick">Use picked as text</button>
      </div>
      <div class="sample" id="sample"><p class="lg">Large heading text</p><p>Regular body text reads like this. The quick brown fox jumps over the lazy dog.</p></div>
      <div class="ratio" id="ratio"></div>
      <div class="badges" id="badges"></div>
    </div>
  </div>
  <div class="card row">
    <h2>Palettes from the picked colour</h2>
    <div id="palettes"></div>
    <div class="label">Click any swatch to copy its hex code.</div>
  </div>
</div>
<div id="toast"></div>
<script>
"use strict";
const $ = id => document.getElementById(id);
// ---- colour maths ----
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
function hexToRgb(h) {
  h = h.trim().replace(/^#/, '');
  if (/^[0-9a-f]{3}$/i.test(h)) h = [...h].map(c => c + c).join('');
  if (!/^[0-9a-f]{6}$/i.test(h)) return null;
  return [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16));
}
const rgbToHex = ([r, g, b]) => '#' + [r, g, b].map(v => Math.round(clamp(v, 0, 255)).toString(16).padStart(2, '0')).join('');
function rgbToHsl([r, g, b]) {
  r /= 255; g /= 255; b /= 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2, d = mx - mn;
  let h = 0, s = 0;
  if (d) {
    s = d / (1 - Math.abs(2 * l - 1));
    h = mx === r ? ((g - b) / d) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
    h *= 60; if (h < 0) h += 360;
  }
  return [h, s * 100, l * 100];
}
function hslToRgb([h, s, l]) {
  s /= 100; l /= 100;
  const k = n => (n + h / 30) % 12, a = s * Math.min(l, 1 - l);
  const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, 9 - k(n), 1));
  return [f(0) * 255, f(8) * 255, f(4) * 255];
}
const lin = c => { c /= 255; return c <= .04045 ? c / 12.92 : ((c + .055) / 1.055) ** 2.4; };
function luminance([r, g, b]) { return .2126 * lin(r) + .7152 * lin(g) + .0722 * lin(b); }
function contrast(a, b) { const L1 = luminance(a), L2 = luminance(b); return (Math.max(L1, L2) + .05) / (Math.min(L1, L2) + .05); }
function rgbToOklch([r, g, b]) {
  const R = lin(r), G = lin(g), B = lin(b);
  const l = Math.cbrt(.4122214708 * R + .5363325363 * G + .0514459929 * B);
  const m = Math.cbrt(.2119034982 * R + .6806995451 * G + .1073969566 * B);
  const s = Math.cbrt(.0883024619 * R + .2817188376 * G + .6299787005 * B);
  const L = .2104542553 * l + .793617785 * m - .0040720468 * s;
  const A = 1.9779984951 * l - 2.428592205 * m + .4505937099 * s;
  const Bb = .0259040371 * l + .7827717662 * m - .808675766 * s;
  let h = Math.atan2(Bb, A) * 180 / Math.PI; if (h < 0) h += 360;
  return [L, Math.hypot(A, Bb), h];
}
function parseAny(s) {
  s = s.trim();
  const hx = hexToRgb(s); if (hx) return hx;
  let m = s.match(/^rgba?\(\s*([\d.]+)[\s,]+([\d.]+)[\s,]+([\d.]+)/i); if (m) return [+m[1], +m[2], +m[3]].map(v => clamp(v, 0, 255));
  m = s.match(/^hsla?\(\s*([\d.]+)(?:deg)?[\s,]+([\d.]+)%?[\s,]+([\d.]+)%?/i); if (m) return hslToRgb([+m[1], +m[2], +m[3]]);
  const probe = document.createElement('div'); probe.style.color = s;
  if (probe.style.color) { document.body.appendChild(probe); const c = getComputedStyle(probe).color; probe.remove(); m = c.match(/(\d+)[,\s]+(\d+)[,\s]+(\d+)/); if (m) return [+m[1], +m[2], +m[3]]; }
  return null;
}

// ---- state ----
let hsl = [28, 84, 65];
const rgb = () => hslToRgb(hsl);
function toast(t) { const el = $('toast'); el.textContent = t; el.style.opacity = 1; clearTimeout(toast.h); toast.h = setTimeout(() => el.style.opacity = 0, 1200); }
function copy(t) {
  const ok = () => toast('Copied ' + t);
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(t).then(ok, fb); else fb();
  function fb() { const a = document.createElement('textarea'); a.value = t; document.body.appendChild(a); a.select(); try { document.execCommand('copy'); ok(); } catch (e) {} a.remove(); }
}
const fmtRgb = c => `rgb(${c.map(v => Math.round(v)).join(', ')})`;
const fmtHsl = h => `hsl(${Math.round(h[0])} ${Math.round(h[1])}% ${Math.round(h[2])}%)`;
const fmtOk = c => { const [L, C, H] = rgbToOklch(c); return `oklch(${(L * 100).toFixed(1)}% ${C.toFixed(3)} ${H.toFixed(1)})`; };

function render(skip) {
  const c = rgb(), hex = rgbToHex(c);
  $('big').style.background = hex; $('native').value = hex;
  if (skip !== 'hex') $('hex').value = hex;
  if (skip !== 'rgb') $('rgb').value = fmtRgb(c);
  if (skip !== 'hsl') $('hsl').value = fmtHsl(hsl);
  $('oklch').value = fmtOk(c);
  $('sH').value = hsl[0]; $('sS').value = hsl[1]; $('sL').value = hsl[2];
  $('oH').textContent = Math.round(hsl[0]) + '°'; $('oS').textContent = Math.round(hsl[1]) + '%'; $('oL').textContent = Math.round(hsl[2]) + '%';
  $('sH').style.background = `linear-gradient(90deg,${[0, 60, 120, 180, 240, 300, 360].map(h => `hsl(${h} ${hsl[1]}% ${hsl[2]}%)`).join(',')})`;
  $('sS').style.background = `linear-gradient(90deg,hsl(${hsl[0]} 0% ${hsl[2]}%),hsl(${hsl[0]} 100% ${hsl[2]}%))`;
  $('sL').style.background = `linear-gradient(90deg,#000,hsl(${hsl[0]} ${hsl[1]}% 50%),#fff)`;
  palettes();
  try { localStorage.setItem('colorlab', JSON.stringify(hsl)); } catch (e) {}
}
function setRgb(c, skip) { hsl = rgbToHsl(c); render(skip); }

for (const id of ['hex', 'rgb', 'hsl']) $(id).addEventListener('input', () => { const c = parseAny($(id).value); if (c) setRgb(c, id); });
$('native').addEventListener('input', e => setRgb(hexToRgb(e.target.value)));
['sH', 'sS', 'sL'].forEach((id, i) => $(id).addEventListener('input', e => { hsl[i] = +e.target.value; render(); }));
document.querySelectorAll('[data-copy]').forEach(b => b.onclick = () => copy($(b.dataset.copy).value));
$('random').onclick = () => { hsl = [Math.random() * 360, 45 + Math.random() * 50, 35 + Math.random() * 35]; render(); };
if ('EyeDropper' in window) {
  $('eyedrop').hidden = false;
  $('eyedrop').onclick = async () => { try { const r = await new EyeDropper().open(); setRgb(hexToRgb(r.sRGBHex)); } catch (e) {} };
}

// ---- palettes ----
function palettes() {
  const [h, s, l] = hsl, wrap = h2 => (h2 % 360 + 360) % 360;
  const sets = {
    'Shades': [92, 80, 66, 52, 40, 28, 16].map(L => [h, s, L]),
    'Complementary': [[h, s, l], [h, s * .5, Math.min(90, l + 25)], [wrap(h + 180), s, l], [wrap(h + 180), s * .5, Math.max(12, l - 25)]],
    'Analogous': [-40, -20, 0, 20, 40].map(d => [wrap(h + d), s, l]),
    'Triadic': [0, 120, 240].map(d => [wrap(h + d), s, l]),
    'Split complementary': [[h, s, l], [wrap(h + 150), s, l], [wrap(h + 210), s, l]],
    'Tetradic': [0, 90, 180, 270].map(d => [wrap(h + d), s, l]),
  };
  const out = $('palettes'); out.innerHTML = '';
  for (const [name, cols] of Object.entries(sets)) {
    const lab = document.createElement('div'); lab.className = 'label'; lab.innerHTML = `<span>${name}</span>`;
    const cp = document.createElement('button'); cp.textContent = 'Copy all'; cp.style.fontSize = '11.5px'; cp.style.padding = '2px 8px';
    const hexes = cols.map(c => rgbToHex(hslToRgb(c)));
    cp.onclick = () => copy(hexes.join(' '));
    lab.appendChild(cp); out.appendChild(lab);
    const sw = document.createElement('div'); sw.className = 'swatches';
    hexes.forEach(hx => {
      const d = document.createElement('div'); d.style.background = hx; d.textContent = hx;
      d.style.color = contrast(hexToRgb(hx), [255, 255, 255]) > 3.2 ? '#fff' : '#111';
      d.onclick = () => copy(hx); d.ondblclick = () => setRgb(hexToRgb(hx));
      d.title = 'Click to copy · double-click to pick';
      sw.appendChild(d);
    });
    out.appendChild(sw);
  }
}

// ---- contrast ----
function checkContrast() {
  const f = parseAny($('fg').value), b = parseAny($('bg').value);
  if (!f || !b) { $('ratio').textContent = '—'; $('badges').innerHTML = ''; return; }
  $('fgDot').style.background = rgbToHex(f); $('bgDot').style.background = rgbToHex(b);
  $('sample').style.color = rgbToHex(f); $('sample').style.background = rgbToHex(b);
  const r = contrast(f, b);
  $('ratio').textContent = r.toFixed(2) + ' : 1';
  const tests = [['AA body text', 4.5], ['AA large text', 3], ['AAA body text', 7], ['AAA large text', 4.5], ['UI & icons', 3]];
  $('badges').innerHTML = tests.map(([n, t]) => `<span class="badge ${r >= t ? 'ok' : 'no'}">${r >= t ? '✓' : '✗'} ${n}</span>`).join('');
}
$('fg').addEventListener('input', checkContrast); $('bg').addEventListener('input', checkContrast);
$('swapFB').onclick = () => { const t = $('fg').value; $('fg').value = $('bg').value; $('bg').value = t; checkContrast(); };
$('usePick').onclick = () => { $('fg').value = rgbToHex(rgb()); checkContrast(); };

try { const s = JSON.parse(localStorage.getItem('colorlab')); if (Array.isArray(s) && s.length === 3) hsl = s; } catch (e) {}
$('fg').value = '#e8e6e3'; $('bg').value = '#161820';
render(); checkContrast();
</script>
</body>
</html>

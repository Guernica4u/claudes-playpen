<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Notepad</title>
<style>
:root{--bg:#0e0f13;--panel:#161820;--ink:#e8e6e3;--muted:#8a8f9c;--line:#2a2d3a;--accent:#f0b35a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
body{display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
h1{font-size:15px;letter-spacing:.06em;margin:0;font-weight:650}
h1 span{color:var(--accent)}
.sp{flex:1}
button{font:inherit;font-size:12.5px;color:var(--ink);background:#1e212b;border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer}
button:hover{border-color:#4a5066}
button.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
#status{color:var(--muted);font-size:12px}
main{flex:1;display:flex;min-height:0}
aside{width:250px;flex:none;border-right:1px solid var(--line);display:flex;flex-direction:column;background:var(--panel)}
#search{margin:10px;font:inherit;background:#0f1117;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 9px}
#search:focus,textarea:focus{outline:none;border-color:#4a5066}
#list{flex:1;overflow:auto;padding:0 6px 10px}
.item{padding:8px 10px;border-radius:7px;cursor:pointer;margin-bottom:2px}
.item:hover{background:#1e212b}
.item.sel{background:#23262f;box-shadow:inset 3px 0 0 var(--accent)}
.item b{display:block;font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item small{color:var(--muted);font-size:11.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.panes{flex:1;display:flex;min-width:0}
textarea{flex:1;border:0;border-right:1px solid var(--line);background:var(--bg);color:var(--ink);padding:18px 22px;font:14px/1.65 ui-monospace,Consolas,monospace;resize:none;min-width:0}
#preview{flex:1;overflow:auto;padding:18px 26px;min-width:0;line-height:1.65}
.panes.edit #preview,.panes.view textarea{display:none}
.panes.view #preview{max-width:760px;margin:0 auto}
#preview h1,#preview h2,#preview h3{line-height:1.25;margin:1.1em 0 .5em}
#preview h1{font-size:1.7em}#preview h2{font-size:1.35em}#preview h3{font-size:1.12em}
#preview a{color:#6aa6ff}
#preview code{background:#1e212b;padding:1px 5px;border-radius:4px;font-size:.92em}
#preview pre{background:#161820;border:1px solid var(--line);padding:12px;border-radius:8px;overflow:auto}
#preview pre code{background:none;padding:0}
#preview blockquote{margin:0;padding:2px 14px;border-left:3px solid var(--accent);color:var(--muted)}
#preview hr{border:0;border-top:1px solid var(--line);margin:1.4em 0}
#preview li.task{list-style:none;margin-left:-1.3em}
#preview table{border-collapse:collapse}
#preview td,#preview th{border:1px solid var(--line);padding:4px 10px}
@media (max-width:760px){main{flex-direction:column}aside{width:auto;max-height:32vh;border-right:0;border-bottom:1px solid var(--line)}.panes.split #preview{display:none}}
</style>
</head>
<body>
<header>
  <h1>NOTE<span>PAD</span></h1>
  <button id="new">+ New note</button>
  <span class="sp"></span>
  <span id="status"></span>
  <button data-view="edit">Write</button><button data-view="split">Split</button><button data-view="view">Read</button>
  <button id="export" title="Download this note as a .md file">Export</button>
  <button id="import" title="Open a .md or .txt file as a new note">Import</button>
  <button id="del">Delete</button>
  <input type="file" id="file" accept=".md,.txt,text/*" hidden>
</header>
<main>
  <aside><input id="search" placeholder="Search notes…"><div id="list"></div></aside>
  <div class="panes split" id="panes"><textarea id="ed" spellcheck="true" placeholder="Start typing… Markdown works: # heading, **bold**, - list, [ ] task"></textarea><div id="preview"></div></div>
</main>
<script>
"use strict";
const $ = id => document.getElementById(id);
const KEY = 'notepad-notes';
let notes = [], cur = null, storageOk = true;
function load() {
  try { notes = JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { storageOk = false; notes = []; }
  if (!notes.length) notes = [{id: Date.now(), text: WELCOME, t: Date.now()}];
}
function persist() {
  try { localStorage.setItem(KEY, JSON.stringify(notes)); $('status').textContent = 'Saved'; }
  catch (e) { storageOk = false; $('status').textContent = 'Not saved: this browser is blocking storage'; }
}
const WELCOME = `# Welcome to Notepad

Notes save automatically **in this browser** as you type. Use **Export** to keep a copy as a file.

## Markdown you can use
- **bold**, *italic*, ~~strike~~, \`code\`
- [links](https://example.com)
- [ ] a task
- [x] a finished task

> Quotes look like this.

\`\`\`
code blocks too
\`\`\`
`;

// ---- tiny, safe markdown renderer (escapes all HTML first) ----
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
function inline(s) {
  const codes = [];
  s = s.replace(/`([^`]+)`/g, (m, c) => { codes.push(c); return `\u0000${codes.length - 1}\u0000`; });
  s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m, t, u) => /^(https?:|mailto:|#)/i.test(u.replace(/&amp;/g, '&')) ? `<a href="${u}" target="_blank" rel="noopener noreferrer">${t}</a>` : m)
       .replace(/(^|[\s(])(https?:\/\/[^\s<]+[^\s<.,;:!?)])/g, '$1<a href="$2" target="_blank" rel="noopener noreferrer">$2</a>')
       .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/__(.+?)__/g, '<strong>$1</strong>')
       .replace(/(^|[^*])\*([^*\s][^*]*?)\*/g, '$1<em>$2</em>').replace(/(^|\W)_([^_\s][^_]*?)_(?=\W|$)/g, '$1<em>$2</em>')
       .replace(/~~(.+?)~~/g, '<del>$1</del>');
  return s.replace(/\u0000(\d+)\u0000/g, (m, i) => `<code>${codes[i]}</code>`);
}
function md(src) {
  const lines = esc(src).split('\n'), out = [];
  let i = 0;
  while (i < lines.length) {
    const l = lines[i];
    if (/^```/.test(l)) { const buf = []; i++; while (i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]); i++; out.push(`<pre><code>${buf.join('\n')}</code></pre>`); continue; }
    let m;
    if ((m = l.match(/^(#{1,6})\s+(.*)/))) { out.push(`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`); i++; continue; }
    if (/^(\*\s*\*\s*\*|-\s*-\s*-|_\s*_\s*_)[\s*_-]*$/.test(l)) { out.push('<hr>'); i++; continue; }
    if (/^&gt;\s?/.test(l)) { const buf = []; while (i < lines.length && /^&gt;\s?/.test(lines[i])) buf.push(lines[i++].replace(/^&gt;\s?/, '')); out.push(`<blockquote>${md2(buf)}</blockquote>`); continue; }
    if (/^\s*([-*+]|\d+\.)\s+/.test(l)) {
      const ordered = /^\s*\d+\./.test(l), buf = [];
      while (i < lines.length && /^\s*([-*+]|\d+\.)\s+/.test(lines[i])) buf.push(lines[i++].replace(/^\s*([-*+]|\d+\.)\s+/, ''));
      out.push(`<${ordered ? 'ol' : 'ul'}>` + buf.map(x => {
        const t = x.match(/^\[([ xX])\]\s*(.*)/);
        return t ? `<li class="task"><input type="checkbox" disabled ${t[1] !== ' ' ? 'checked' : ''}> ${inline(t[2])}</li>` : `<li>${inline(x)}</li>`;
      }).join('') + `</${ordered ? 'ol' : 'ul'}>`);
      continue;
    }
    if (/^\|.*\|\s*$/.test(l) && i + 1 < lines.length && /^\|[\s:|-]+\|\s*$/.test(lines[i + 1])) {
      const row = r => r.trim().replace(/^\||\|$/g, '').split('|').map(c => inline(c.trim()));
      const head = row(l); i += 2; const body = [];
      while (i < lines.length && /^\|.*\|\s*$/.test(lines[i])) body.push(row(lines[i++]));
      out.push(`<table><tr>${head.map(c => `<th>${c}</th>`).join('')}</tr>${body.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</table>`);
      continue;
    }
    if (!l.trim()) { i++; continue; }
    const buf = []; while (i < lines.length && lines[i].trim() && !/^(#{1,6}\s|```|&gt;|\s*([-*+]|\d+\.)\s+)/.test(lines[i])) buf.push(lines[i++]);
    if (!buf.length) buf.push(lines[i++]);
    out.push(`<p>${buf.map(inline).join('<br>')}</p>`);
  }
  return out.join('\n');
}
const md2 = lines => md(lines.join('\n').replace(/&gt;/g, '>').replace(/&lt;/g, '<').replace(/&quot;/g, '"').replace(/&amp;/g, '&'));

// ---- UI ----
const title = n => (n.text.match(/^\s*#*\s*(.+)/m) || [, 'Untitled'])[1].slice(0, 60);
const snippet = n => n.text.split('\n').slice(1).join(' ').replace(/[#*_>`\[\]-]/g, '').trim().slice(0, 80) || 'Empty note';
function when(t) {
  const d = new Date(t), now = new Date();
  return d.toDateString() === now.toDateString() ? d.toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'}) : d.toLocaleDateString();
}
function renderList() {
  const q = $('search').value.toLowerCase();
  const list = $('list'); list.innerHTML = '';
  notes.sort((a, b) => b.t - a.t).filter(n => !q || n.text.toLowerCase().includes(q)).forEach(n => {
    const d = document.createElement('div'); d.className = 'item' + (n === cur ? ' sel' : '');
    const b = document.createElement('b'); b.textContent = title(n);
    const s = document.createElement('small'); s.textContent = `${when(n.t)} · ${snippet(n)}`;
    d.append(b, s); d.onclick = () => open(n); list.appendChild(d);
  });
}
function open(n) { cur = n; $('ed').value = n.text; $('preview').innerHTML = md(n.text); renderList(); words(); }
function words() { const w = (cur.text.match(/\S+/g) || []).length; if (storageOk) $('status').textContent = `${w} word${w === 1 ? '' : 's'}`; }
let saveT;
$('ed').addEventListener('input', () => {
  cur.text = $('ed').value; cur.t = Date.now();
  $('preview').innerHTML = md(cur.text);
  clearTimeout(saveT); $('status').textContent = 'Saving…';
  saveT = setTimeout(() => { persist(); renderList(); setTimeout(words, 800); }, 400);
});
$('ed').addEventListener('keydown', e => {
  if (e.key === 'Tab') { e.preventDefault(); document.execCommand('insertText', false, '  '); }
});
$('new').onclick = () => { const n = {id: Date.now(), text: '# ', t: Date.now()}; notes.push(n); persist(); open(n); $('ed').focus(); $('ed').setSelectionRange(2, 2); };
$('del').onclick = () => {
  if (!confirm(`Delete “${title(cur)}”? This can't be undone.`)) return;
  notes = notes.filter(n => n !== cur);
  if (!notes.length) notes.push({id: Date.now(), text: '# ', t: Date.now()});
  persist(); open(notes.sort((a, b) => b.t - a.t)[0]);
};
$('search').addEventListener('input', renderList);
$('export').onclick = () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([cur.text], {type: 'text/markdown'}));
  a.download = title(cur).replace(/[^\w\- ]+/g, '').trim().replace(/\s+/g, '-').toLowerCase() + '.md' || 'note.md';
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};
$('import').onclick = () => $('file').click();
$('file').onchange = async e => {
  for (const f of e.target.files) { const n = {id: Date.now() + Math.random(), text: await f.text(), t: Date.now()}; notes.push(n); open(n); }
  persist(); e.target.value = '';
};
document.querySelectorAll('[data-view]').forEach(b => b.onclick = () => setView(b.dataset.view));
function setView(v) {
  $('panes').className = 'panes ' + v;
  document.querySelectorAll('[data-view]').forEach(b => b.classList.toggle('on', b.dataset.view === v));
  try { localStorage.setItem('notepad-view', v); } catch (e) {}
}
addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); persist(); } });

load();
let v = 'split'; try { v = localStorage.getItem('notepad-view') || 'split'; } catch (e) {}
setView(v);
open(notes.sort((a, b) => b.t - a.t)[0]);
if (!storageOk) $('status').textContent = 'Storage blocked: notes will not be kept';
</script>
</body>
</html>

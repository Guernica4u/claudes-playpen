<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Minesweeper</title>
<style>
:root{--bg:#0e0f13;--panel:#161820;--ink:#e8e6e3;--muted:#8a8f9c;--line:#2a2d3a;--accent:#f0b35a;
  --tile:#2a2e3b;--tileHi:#343949;--open:#1a1c24;--bad:#e5484d}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
body{display:flex;flex-direction:column;align-items:center;padding:24px 16px}
h1{font-size:18px;letter-spacing:.06em;margin:0 0 14px;font-weight:650}
h1 span{color:var(--accent)}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;margin-bottom:12px}
button{font:inherit;font-size:13px;color:var(--ink);background:#1e212b;border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer}
button:hover{border-color:#4a5066}
button.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.hud{display:flex;gap:18px;align-items:center;margin-bottom:12px;font-variant-numeric:tabular-nums;font-size:15px}
.hud b{color:var(--accent);font-weight:600}
#face{font-size:20px;padding:2px 10px}
.wrap{max-width:100%;overflow:auto;padding:2px}
#board{display:grid;gap:2px;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.c{width:var(--s);height:var(--s);display:flex;align-items:center;justify-content:center;border-radius:4px;background:var(--tile);
  font-weight:700;font-size:calc(var(--s)*.55);cursor:pointer;transition:background .08s}
.c:hover{background:var(--tileHi)}
.c.o{background:var(--open);cursor:default}
.c.m{background:var(--bad)}
.c.x{background:#3a2226}
.n1{color:#6aa6ff}.n2{color:#5fcf80}.n3{color:#ff7a6b}.n4{color:#b58cff}.n5{color:#f0b35a}.n6{color:#4fd6d0}.n7{color:#e8e6e3}.n8{color:#8a8f9c}
#msg{margin-top:14px;min-height:1.5em;color:var(--muted);text-align:center}
.help{margin-top:10px;color:var(--muted);font-size:12px;text-align:center;max-width:520px}
</style>
</head>
<body>
<h1>MINE<span>SWEEPER</span></h1>
<div class="bar">
  <button data-lvl="0">Easy</button><button data-lvl="1">Medium</button><button data-lvl="2">Hard</button>
  <button id="flagMode" title="For touch screens: tap places flags">Flag mode: off</button>
</div>
<div class="hud"><span>Mines left <b id="left">0</b></span><button id="face">🙂</button><span>Time <b id="time">0</b></span></div>
<div class="wrap"><div id="board"></div></div>
<div id="msg"></div>
<div class="help">Click to reveal · right-click to flag · click a number whose flags are all placed to open its neighbours · your first click is always safe</div>
<script>
"use strict";
const LEVELS = [
  {name:'Easy',   w:9,  h:9,  mines:10},
  {name:'Medium', w:16, h:16, mines:40},
  {name:'Hard',   w:30, h:16, mines:99},
];
const boardEl = document.getElementById('board');
const $ = id => document.getElementById(id);
let lvl = 0, W, H, M, mine, open, flag, adj, cells, started, over, openCount, flags, t0, timer, flagMode = false;

function best(i, v) {
  try {
    const k = 'minesweeper-best-' + i;
    if (v === undefined) return +localStorage.getItem(k) || 0;
    localStorage.setItem(k, v);
  } catch (e) { return 0; }
}
function neighbors(i) {
  const x = i % W, y = (i / W) | 0, out = [];
  for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
    if (!dx && !dy) continue;
    const nx = x + dx, ny = y + dy;
    if (nx >= 0 && nx < W && ny >= 0 && ny < H) out.push(ny * W + nx);
  }
  return out;
}
function newGame(l = lvl) {
  lvl = l; ({w: W, h: H, mines: M} = LEVELS[l]);
  document.querySelectorAll('[data-lvl]').forEach(b => b.classList.toggle('on', +b.dataset.lvl === l));
  mine = new Uint8Array(W * H); open = new Uint8Array(W * H); flag = new Uint8Array(W * H); adj = new Uint8Array(W * H);
  started = false; over = false; openCount = 0; flags = 0;
  clearInterval(timer); $('time').textContent = 0; $('face').textContent = '🙂';
  const b = best(l); $('msg').textContent = b ? `Best ${LEVELS[l].name} time: ${b}s` : '';
  const s = Math.max(22, Math.min(34, Math.floor((Math.min(innerWidth, 1100) - 40) / W) - 2));
  boardEl.style.setProperty('--s', s + 'px');
  boardEl.style.gridTemplateColumns = `repeat(${W}, var(--s))`;
  boardEl.innerHTML = '';
  cells = [];
  for (let i = 0; i < W * H; i++) {
    const d = document.createElement('div'); d.className = 'c'; d.dataset.i = i;
    boardEl.appendChild(d); cells.push(d);
  }
  updateLeft();
}
function plant(safe) {
  const banned = new Set([safe, ...neighbors(safe)]);
  const pool = [];
  for (let i = 0; i < W * H; i++) if (!banned.has(i)) pool.push(i);
  for (let k = 0; k < M; k++) {
    const r = k + Math.floor(Math.random() * (pool.length - k));
    [pool[k], pool[r]] = [pool[r], pool[k]];
    mine[pool[k]] = 1;
  }
  for (let i = 0; i < W * H; i++) adj[i] = neighbors(i).reduce((a, j) => a + mine[j], 0);
}
function updateLeft() { $('left').textContent = M - flags; }
function draw(i) {
  const d = cells[i];
  if (open[i]) {
    d.className = 'c o' + (adj[i] ? ' n' + adj[i] : '');
    d.textContent = adj[i] || '';
  } else {
    d.className = 'c'; d.textContent = flag[i] ? '🚩' : '';
  }
}
function reveal(i) {
  if (open[i] || flag[i]) return;
  if (mine[i]) return lose(i);
  const stack = [i];
  while (stack.length) {
    const j = stack.pop();
    if (open[j] || flag[j]) continue;
    open[j] = 1; openCount++; draw(j);
    if (adj[j] === 0) for (const n of neighbors(j)) if (!open[n] && !mine[n]) stack.push(n);
  }
  if (openCount === W * H - M) win();
}
function chord(i) {
  const ns = neighbors(i);
  if (ns.filter(n => flag[n]).length !== adj[i]) return;
  for (const n of ns) if (!open[n] && !flag[n]) { reveal(n); if (over) return; }
}
function toggleFlag(i) {
  if (open[i]) return;
  flag[i] ^= 1; flags += flag[i] ? 1 : -1; draw(i); updateLeft();
}
function click(i) {
  if (over) return;
  if (!started) {
    started = true; plant(i); t0 = Date.now();
    timer = setInterval(() => $('time').textContent = Math.floor((Date.now() - t0) / 1000), 250);
  }
  if (open[i]) chord(i); else reveal(i);
}
function lose(i) {
  over = true; clearInterval(timer); $('face').textContent = '😵';
  for (let j = 0; j < W * H; j++) {
    if (mine[j] && !flag[j]) { cells[j].className = 'c o'; cells[j].textContent = '💣'; }
    else if (!mine[j] && flag[j]) { cells[j].className = 'c x'; cells[j].textContent = '❌'; }
  }
  cells[i].className = 'c m';
  $('msg').textContent = 'Boom. Click the face to try again.';
}
function win() {
  over = true; clearInterval(timer); $('face').textContent = '😎';
  const secs = Math.max(1, Math.round((Date.now() - t0) / 1000));
  $('time').textContent = secs;
  for (let j = 0; j < W * H; j++) if (mine[j] && !flag[j]) { flag[j] = 1; draw(j); }
  flags = M; updateLeft();
  const b = best(lvl);
  if (!b || secs < b) { best(lvl, secs); $('msg').textContent = `Cleared in ${secs}s. New best!`; }
  else $('msg').textContent = `Cleared in ${secs}s. Best is ${b}s.`;
}

boardEl.addEventListener('click', e => {
  const i = e.target.closest('.c')?.dataset.i; if (i === undefined) return;
  if (flagMode && !open[+i]) { if (!over) toggleFlag(+i); } else click(+i);
});
boardEl.addEventListener('contextmenu', e => {
  e.preventDefault();
  const i = e.target.closest('.c')?.dataset.i; if (i === undefined || over) return;
  if (open[+i]) click(+i); else toggleFlag(+i);
});
boardEl.addEventListener('mousedown', e => { if (!over && e.button === 0) $('face').textContent = '😮'; });
addEventListener('mouseup', () => { if (!over) $('face').textContent = '🙂'; });
document.querySelectorAll('[data-lvl]').forEach(b => b.onclick = () => newGame(+b.dataset.lvl));
$('face').onclick = () => newGame();
$('flagMode').onclick = () => { flagMode = !flagMode; $('flagMode').textContent = 'Flag mode: ' + (flagMode ? 'on' : 'off'); $('flagMode').classList.toggle('on', flagMode); };
addEventListener('keydown', e => { if (e.key === 'F2' || e.key.toLowerCase() === 'n') newGame(); });
newGame(0);
</script>
</body>
</html>

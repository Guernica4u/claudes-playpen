<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>2048</title>
<style>
:root{--bg:#0e0f13;--panel:#161820;--ink:#e8e6e3;--muted:#8a8f9c;--line:#2a2d3a;--accent:#f0b35a;--gap:10px;--size:min(440px,calc(100vw - 32px))}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{width:var(--size);margin:0 auto;padding:24px 0}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
h1{font-size:34px;margin:0;font-weight:800;letter-spacing:.02em;color:var(--accent);flex:1}
.score{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px 12px;text-align:center;min-width:72px}
.score small{display:block;font-size:10px;letter-spacing:.1em;color:var(--muted)}
.score b{font-size:18px;font-variant-numeric:tabular-nums}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;color:var(--muted);font-size:12.5px}
button{font:inherit;font-size:13px;color:var(--ink);background:#1e212b;border:1px solid var(--line);border-radius:6px;padding:6px 12px;cursor:pointer}
button:hover{border-color:#4a5066}
.board{position:relative;width:var(--size);height:var(--size);background:#1a1c24;border-radius:12px;padding:var(--gap);touch-action:none;user-select:none}
.cell,.tile{position:absolute;width:calc((var(--size) - 5 * var(--gap)) / 4);height:calc((var(--size) - 5 * var(--gap)) / 4);border-radius:8px}
.cell{background:#23262f}
.tile{display:flex;align-items:center;justify-content:center;font-weight:800;transition:transform .11s ease-in-out;will-change:transform}
.tile .in{width:100%;height:100%;border-radius:8px;display:flex;align-items:center;justify-content:center}
.tile.new .in{animation:pop .16s ease-out}
.tile.merged .in{animation:bump .18s ease-out}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes bump{50%{transform:scale(1.14)}}
.over{position:absolute;inset:0;background:#0e0f13cc;border-radius:12px;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:5}
.over.show{display:flex}
.over h2{margin:0;font-size:30px}
.help{color:var(--muted);font-size:12px;margin-top:14px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><h1>2048</h1><div class="score"><small>SCORE</small><b id="score">0</b></div><div class="score"><small>BEST</small><b id="best">0</b></div></div>
  <div class="bar"><span>Join the tiles to reach <b>2048</b>.</span><span><button id="undo">Undo</button> <button id="new">New game</button></span></div>
  <div class="board" id="board"><div class="over" id="over"><h2 id="overMsg"></h2><div style="display:flex;gap:8px"><button id="keep">Keep going</button><button id="retry">Try again</button></div></div></div>
  <div class="help">Arrow keys or WASD to move · swipe on touch screens · U to undo</div>
</div>
<script>
"use strict";
const $ = id => document.getElementById(id);
const board = $('board');
const COLORS = {2:['#2c303c','#e8e6e3'],4:['#363a48','#e8e6e3'],8:['#8a5a2b','#fff'],16:['#b36a2a','#fff'],32:['#c9562e','#fff'],64:['#d8412f','#fff'],
  128:['#d9a441','#1a1409'],256:['#e3b44c','#1a1409'],512:['#f0c14b','#1a1409'],1024:['#f5d05a','#1a1409'],2048:['#ffe066','#1a1409']};
let grid, score, best = 0, won, keepGoing, history = [], idc = 0;
try { best = +localStorage.getItem('2048-best') || 0; } catch (e) {}

for (let i = 0; i < 16; i++) { const c = document.createElement('div'); c.className = 'cell'; place(c, i % 4, i >> 2, true); board.appendChild(c); }
function place(el, x, y, abs) {
  const pos = `calc(var(--gap) + ${x} * ((var(--size) - 5 * var(--gap)) / 4 + var(--gap)))`, posY = pos.replace(`${x} *`, `${y} *`);
  if (abs) { el.style.left = pos; el.style.top = posY; }
  else el.style.transform = `translate(calc(${x} * ((var(--size) - 5 * var(--gap)) / 4 + var(--gap))), calc(${y} * ((var(--size) - 5 * var(--gap)) / 4 + var(--gap))))`;
}
function makeTile(v, x, y, cls) {
  const el = document.createElement('div'); el.className = 'tile ' + (cls || '');
  el.style.left = el.style.top = 'var(--gap)';
  const inner = document.createElement('div'); inner.className = 'in'; el.appendChild(inner);
  const t = {id: ++idc, v, x, y, el};
  paint(t); place(el, x, y); board.appendChild(el);
  return t;
}
function paint(t) {
  const [bg, fg] = COLORS[t.v] || ['#fff3b0', '#1a1409'];
  const inner = t.el.firstChild;
  inner.textContent = t.v; inner.style.background = bg; inner.style.color = fg;
  const digits = String(t.v).length;
  inner.style.fontSize = `calc(var(--size) / ${digits < 3 ? 9 : digits === 3 ? 11 : 13.5})`;
  if (t.v >= 128) inner.style.boxShadow = `0 0 ${Math.min(30, Math.log2(t.v) * 2)}px -4px ${bg}`;
}
function empties() { const e = []; for (let y = 0; y < 4; y++) for (let x = 0; x < 4; x++) if (!grid[y][x]) e.push([x, y]); return e; }
function spawn() {
  const e = empties(); if (!e.length) return;
  const [x, y] = e[Math.floor(Math.random() * e.length)];
  grid[y][x] = makeTile(Math.random() < .9 ? 2 : 4, x, y, 'new');
}
function snapshot() { return {g: grid.map(r => r.map(t => t ? t.v : 0)), score, won}; }
function restore(s) {
  tiles().forEach(t => t.el.remove());
  grid = s.g.map((r, y) => r.map((v, x) => v ? makeTile(v, x, y) : null));
  score = s.score; won = s.won; updateScore(); $('over').classList.remove('show');
}
const tiles = () => grid.flat().filter(Boolean);
function updateScore() {
  $('score').textContent = score;
  if (score > best) { best = score; try { localStorage.setItem('2048-best', best); } catch (e) {} }
  $('best').textContent = best;
}
function newGame() {
  if (grid) tiles().forEach(t => t.el.remove());
  grid = [...Array(4)].map(() => Array(4).fill(null));
  score = 0; won = false; keepGoing = false; history = [];
  spawn(); spawn(); updateScore(); $('over').classList.remove('show');
}

let busy = false;
function move(dir) {  // 0 left, 1 right, 2 up, 3 down
  if (busy || $('over').classList.contains('show')) return;
  const before = snapshot();
  const vec = [[-1, 0], [1, 0], [0, -1], [0, 1]][dir];
  const xs = [0, 1, 2, 3], ys = [0, 1, 2, 3];
  if (vec[0] === 1) xs.reverse(); if (vec[1] === 1) ys.reverse();
  let moved = false; const merged = new Set(), dying = [];
  for (const y of ys) for (const x of xs) {
    const t = grid[y][x]; if (!t) continue;
    let cx = x, cy = y;
    while (true) {
      const nx = cx + vec[0], ny = cy + vec[1];
      if (nx < 0 || nx > 3 || ny < 0 || ny > 3) break;
      const o = grid[ny][nx];
      if (!o) { cx = nx; cy = ny; continue; }
      if (o.v === t.v && !merged.has(o.id)) {
        o.v *= 2; merged.add(o.id); score += o.v; dying.push({t, x: nx, y: ny, into: o});
        grid[y][x] = null; moved = true; cx = -1;
      }
      break;
    }
    if (cx === -1) continue;
    if (cx !== x || cy !== y) { grid[y][x] = null; grid[cy][cx] = t; t.x = cx; t.y = cy; moved = true; }
  }
  if (!moved) return;
  history.push(before); if (history.length > 20) history.shift();
  busy = true;
  tiles().forEach(t => { t.el.classList.remove('new', 'merged'); place(t.el, t.x, t.y); });
  dying.forEach(d => { d.t.el.style.zIndex = 0; place(d.t.el, d.x, d.y); });
  setTimeout(() => {
    dying.forEach(d => { d.t.el.remove(); paint(d.into); d.into.el.classList.add('merged'); if (d.into.v === 2048 && !won) won = true; });
    spawn(); updateScore(); busy = false;
    if (won && !keepGoing) { $('overMsg').textContent = 'You made 2048!'; $('keep').style.display = ''; $('over').classList.add('show'); }
    else if (!canMove()) { $('overMsg').textContent = 'No moves left'; $('keep').style.display = 'none'; $('over').classList.add('show'); }
  }, 115);
}
function canMove() {
  if (empties().length) return true;
  for (let y = 0; y < 4; y++) for (let x = 0; x < 4; x++) {
    const v = grid[y][x].v;
    if ((x < 3 && grid[y][x + 1].v === v) || (y < 3 && grid[y + 1][x].v === v)) return true;
  }
  return false;
}
function undo() { if (busy || !history.length) return; restore(history.pop()); }

addEventListener('keydown', e => {
  const m = {ArrowLeft: 0, a: 0, ArrowRight: 1, d: 1, ArrowUp: 2, w: 2, ArrowDown: 3, s: 3}[e.key.length === 1 ? e.key.toLowerCase() : e.key];
  if (m !== undefined) { e.preventDefault(); move(m); }
  else if (e.key.toLowerCase() === 'u') undo();
});
let sx, sy;
board.addEventListener('pointerdown', e => { sx = e.clientX; sy = e.clientY; });
board.addEventListener('pointerup', e => {
  if (sx === undefined) return;
  const dx = e.clientX - sx, dy = e.clientY - sy; sx = undefined;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
  move(Math.abs(dx) > Math.abs(dy) ? (dx < 0 ? 0 : 1) : (dy < 0 ? 2 : 3));
});
$('new').onclick = newGame; $('retry').onclick = newGame; $('undo').onclick = undo;
$('keep').onclick = () => { keepGoing = true; $('over').classList.remove('show'); };
newGame();
</script>
</body>
</html>

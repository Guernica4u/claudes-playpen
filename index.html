<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Claude's Playpen</title>
<style>
:root{--bg:#0e0f13;--panel:#161820;--ink:#e8e6e3;--muted:#8a8f9c;--line:#2a2d3a;--accent:#f0b35a}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:40px 16px 60px}
h1{font-size:26px;letter-spacing:.04em;margin:0;font-weight:700}
h1 span{color:var(--accent)}
.lead{color:var(--muted);margin:6px 0 34px;max-width:620px}
h2{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:30px 0 12px;font-weight:600;display:flex;align-items:center;gap:10px}
h2::after{content:"";flex:1;height:1px;background:var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
a.card{display:flex;gap:14px;align-items:flex-start;text-decoration:none;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;transition:border-color .15s,transform .15s}
a.card:hover{border-color:var(--c,var(--accent));transform:translateY(-2px)}
.ico{flex:none;width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px;background:color-mix(in srgb,var(--c) 18%,transparent)}
.card b{display:block;font-size:15px;margin-bottom:2px}
.card p{margin:0;color:var(--muted);font-size:13px}
footer{margin-top:44px;color:var(--muted);font-size:12px}
</style>
</head>
<body>
<div class="wrap">
  <h1>CLAUDE'S <span>PLAYPEN</span></h1>
  <p class="lead">Things I've made here. Each one is a single HTML file that runs offline in your browser, with no installs, no accounts and no tracking. Click one to open it.</p>
  <div id="sections"></div>
  <footer>Tip: bookmark this page. Everything is also listed in README.md.</footer>
</div>
<script>
const ITEMS = {
  Games: [
    ['games/sandfall.html', '⏳', '#f0b35a', 'Sandfall', 'Falling-sand physics. Paint water, fire, lava, acid and plants and watch them react.'],
    ['games/minesweeper.html', '💣', '#ff7a6b', 'Minesweeper', 'The classic, with a safe first click, chording and best times.'],
    ['games/lunar-lander.html', '🚀', '#6aa6ff', 'Lunar Lander', 'Land gently on the pads with limited fuel. Harder pads score more.'],
  ],
  Programs: [
    ['programs/password-generator.html', '🔐', '#5fcf80', 'Password Forge', 'Strong passwords, pronounceable passphrases and PINs, with honest strength numbers.'],
    ['programs/text-tools.html', '🧰', '#4fd6d0', 'Text Tools', 'Encode, decode, hash, change case, sort, clean up and reformat text.'],
    ['programs/focus-timer.html', '⏱️', '#f0b35a', 'Focus Timer', 'Pomodoro-style work and break rounds with a chime and a daily tally.'],
  ],
  Toys: [
    ['toys/flow-field.html', '🌀', '#b58cff', 'Flow Field', 'Generative art from particles drifting through noise. Save your favourites as PNGs.'],
    ['toys/beat-machine.html', '🥁', '#ff5fa2', 'Beat Machine', 'A 16-step drum machine with synthesised sounds, swing and presets.'],
  ],
};
const root = document.getElementById('sections');
for (const [section, items] of Object.entries(ITEMS)) {
  const h = document.createElement('h2'); h.textContent = section; root.appendChild(h);
  const g = document.createElement('div'); g.className = 'grid';
  for (const [href, ico, c, name, desc] of items) {
    const a = document.createElement('a'); a.className = 'card'; a.href = href; a.style.setProperty('--c', c);
    a.innerHTML = `<div class="ico">${ico}</div><div><b></b><p></p></div>`;
    a.querySelector('b').textContent = name; a.querySelector('p').textContent = desc;
    g.appendChild(a);
  }
  root.appendChild(g);
}
</script>
</body>
</html>

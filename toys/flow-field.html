<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flow Field</title>
<style>
html,body{margin:0;height:100%;background:#0b0c10;overflow:hidden;font:13px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;color:#e8e6e3}
canvas{display:block;width:100vw;height:100vh;cursor:crosshair}
#ui{position:fixed;top:12px;left:12px;background:#161820e6;border:1px solid #2a2d3a;border-radius:10px;padding:10px 12px;width:220px;transition:opacity .3s}
#ui.hide{opacity:0;pointer-events:none}
#ui h1{font-size:13px;letter-spacing:.08em;margin:0 0 8px;font-weight:650}
#ui h1 span{color:#f0b35a}
label{display:flex;justify-content:space-between;color:#8a8f9c;font-size:11.5px;margin-top:8px}
input[type=range]{width:100%;accent-color:#f0b35a}
.pal{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:6px}
.pal button{height:18px;border-radius:4px;border:1px solid #2a2d3a;cursor:pointer;padding:0}
.pal button.on{outline:2px solid #f0b35a;outline-offset:1px}
.row{display:flex;gap:6px;margin-top:10px}
.row button{flex:1;font:inherit;font-size:12px;color:#e8e6e3;background:#1e212b;border:1px solid #2a2d3a;border-radius:6px;padding:5px;cursor:pointer}
.row button:hover{border-color:#4a5066}
.tip{color:#8a8f9c;font-size:11px;margin-top:8px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <h1>FLOW<span>FIELD</span></h1>
  <label>Particles <span id="nV"></span></label><input type="range" id="n" min="500" max="12000" step="500" value="4000">
  <label>Scale <span id="scV"></span></label><input type="range" id="sc" min="1" max="12" value="4">
  <label>Swirl <span id="swV"></span></label><input type="range" id="sw" min="1" max="8" value="3">
  <label>Fade <span id="fdV"></span></label><input type="range" id="fd" min="0" max="10" value="2">
  <label>Palette</label><div class="pal" id="pal"></div>
  <div class="row"><button id="new">New seed</button><button id="pause">Pause</button></div>
  <div class="row"><button id="save">Save PNG</button><button id="hide">Hide (H)</button></div>
  <div class="tip">Click and drag to stir the field. Space pauses, N gives a new seed, S saves.</div>
</div>
<script>
"use strict";
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);
let W, H, DPR;

// --- Seeded value noise (smooth 3D gradient noise) ---
let perm;
function reseed(seed) {
  let s = seed >>> 0;
  const rand = () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  const p = [...Array(256).keys()];
  for (let i = 255; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [p[i], p[j]] = [p[j], p[i]]; }
  perm = new Uint8Array(512); for (let i = 0; i < 512; i++) perm[i] = p[i & 255];
}
const fade = t => t * t * t * (t * (t * 6 - 15) + 10);
const lerp = (a, b, t) => a + (b - a) * t;
function grad(h, x, y, z) { const u = h < 8 ? x : y, v = h < 4 ? y : (h === 12 || h === 14 ? x : z); return ((h & 1) ? -u : u) + ((h & 2) ? -v : v); }
function noise(x, y, z) {
  const X = Math.floor(x) & 255, Y = Math.floor(y) & 255, Z = Math.floor(z) & 255;
  x -= Math.floor(x); y -= Math.floor(y); z -= Math.floor(z);
  const u = fade(x), v = fade(y), w = fade(z);
  const A = perm[X] + Y, AA = perm[A] + Z, AB = perm[A + 1] + Z, B = perm[X + 1] + Y, BA = perm[B] + Z, BB = perm[B + 1] + Z;
  return lerp(lerp(lerp(grad(perm[AA] & 15, x, y, z), grad(perm[BA] & 15, x - 1, y, z), u),
                   lerp(grad(perm[AB] & 15, x, y - 1, z), grad(perm[BB] & 15, x - 1, y - 1, z), u), v),
              lerp(lerp(grad(perm[AA + 1] & 15, x, y, z - 1), grad(perm[BA + 1] & 15, x - 1, y, z - 1), u),
                   lerp(grad(perm[AB + 1] & 15, x, y - 1, z - 1), grad(perm[BB + 1] & 15, x - 1, y - 1, z - 1), u), v), w);
}

const PALETTES = [
  ['#0b0c10', ['#f0b35a', '#ff7a6b', '#e8e6e3', '#f5d9a8']],
  ['#06121a', ['#4fd6d0', '#6aa6ff', '#b58cff', '#e8f6ff']],
  ['#0d130c', ['#5fcf80', '#c7e59a', '#2f8f5b', '#f0e6b3']],
  ['#140a14', ['#ff5fa2', '#ffb3d1', '#b58cff', '#ffe08a']],
  ['#f2ede4', ['#1f2a44', '#c1443c', '#2d6a6a', '#d9a441']],
  ['#0a0a0a', ['#ffffff', '#bbbbbb', '#777777', '#ffffff']],
];
let pal = 0, parts = [], t = 0, paused = false, mouse = null;
const opts = {n: 4000, sc: 4, sw: 3, fd: 2};

function resize() {
  DPR = Math.min(2, devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR; ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  clearCanvas();
}
function clearCanvas() { ctx.globalAlpha = 1; ctx.fillStyle = PALETTES[pal][0]; ctx.fillRect(0, 0, W, H); }
function spawn(p) { p.x = Math.random() * W; p.y = Math.random() * H; p.age = 0; p.max = 80 + Math.random() * 220; p.c = PALETTES[pal][1][Math.floor(Math.random() * 4)]; return p; }
function makeParts() { parts = []; for (let i = 0; i < opts.n; i++) parts.push(spawn({})); }

function frame() {
  if (!paused) {
    if (opts.fd > 0) { ctx.globalAlpha = opts.fd * 0.006; ctx.fillStyle = PALETTES[pal][0]; ctx.fillRect(0, 0, W, H); }
    const s = 0.0006 * (13 - opts.sc) + 0.0004, sw = opts.sw;
    ctx.globalAlpha = 0.35; ctx.lineWidth = 0.9;
    // batch by colour to limit state changes
    const byC = {};
    for (const p of parts) {
      let a = noise(p.x * s, p.y * s, t) * Math.PI * sw;
      if (mouse) {
        const dx = p.x - mouse.x, dy = p.y - mouse.y, d2 = dx * dx + dy * dy;
        if (d2 < 22500) a += Math.atan2(dy, dx) + Math.PI / 2 * (1 - d2 / 22500);
      }
      const nx = p.x + Math.cos(a) * 1.6, ny = p.y + Math.sin(a) * 1.6;
      (byC[p.c] ||= []).push(p.x, p.y, nx, ny);
      p.x = nx; p.y = ny;
      if (++p.age > p.max || nx < -5 || nx > W + 5 || ny < -5 || ny > H + 5) spawn(p);
    }
    for (const c in byC) {
      const L = byC[c]; ctx.strokeStyle = c; ctx.beginPath();
      for (let i = 0; i < L.length; i += 4) { ctx.moveTo(L[i], L[i + 1]); ctx.lineTo(L[i + 2], L[i + 3]); }
      ctx.stroke();
    }
    t += 0.0015;
  }
  requestAnimationFrame(frame);
}

// UI
const palEl = $('pal');
PALETTES.forEach(([bg, cs], i) => {
  const b = document.createElement('button');
  b.style.background = `linear-gradient(90deg, ${bg} 0 25%, ${cs[0]} 25% 50%, ${cs[1]} 50% 75%, ${cs[2]} 75%)`;
  b.title = 'Palette ' + (i + 1);
  b.onclick = () => { pal = i; document.querySelectorAll('.pal button').forEach((x, j) => x.classList.toggle('on', j === i)); clearCanvas(); parts.forEach(spawn); };
  palEl.appendChild(b);
});
palEl.firstChild.classList.add('on');
for (const k of ['n', 'sc', 'sw', 'fd']) {
  const el = $(k), out = $(k + 'V');
  const upd = () => { opts[k] = +el.value; out.textContent = el.value; };
  upd();
  el.addEventListener('input', () => { upd(); if (k === 'n') makeParts(); if (k === 'sc' || k === 'sw') clearCanvas(); });
}
function newSeed() { reseed(Math.random() * 1e9); clearCanvas(); makeParts(); }
function togglePause() { paused = !paused; $('pause').textContent = paused ? 'Play' : 'Pause'; }
function save() {
  const a = document.createElement('a'); a.download = `flow-field-${Date.now()}.png`; a.href = cv.toDataURL('image/png'); a.click();
}
function toggleUI() { $('ui').classList.toggle('hide'); }
$('new').onclick = newSeed; $('pause').onclick = togglePause; $('save').onclick = save; $('hide').onclick = toggleUI;
cv.addEventListener('pointerdown', e => { mouse = {x: e.clientX, y: e.clientY}; cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointermove', e => { if (mouse) mouse = {x: e.clientX, y: e.clientY}; });
cv.addEventListener('pointerup', () => mouse = null);
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === ' ') { e.preventDefault(); togglePause(); }
  else if (k === 'n') newSeed(); else if (k === 's') save(); else if (k === 'h') toggleUI();
});
addEventListener('resize', resize);

reseed(Math.random() * 1e9); resize(); makeParts();
requestAnimationFrame(frame);
</script>
</body>
</html>
